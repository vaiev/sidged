[package]
name = "sidged-grant"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "SDG-L2 capability-token checks, Ed25519 signatures, and a Cedar evaluator."

[dependencies]
# RFC 8032 Ed25519 for the signature vectors. The seed is the secret key.
ed25519-dalek = "2"
# E6 and R18: the owner's policy is Cedar, evaluated by the published engine.
cedar-policy = "4"
# JCS walks JSON values. There is no separate JCS crate; this is the parser.
serde_json = "1"
# RFC 7638 thumbprints are SHA-256 over the canonical JWK.
sha2 = "0.10"
