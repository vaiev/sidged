[package]
name = "sidged-tui"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Demo 1: unsigned preview TUI (task, countdown, one approved cloud call (Gemini) via sidged-gateway)"
publish = false

[dependencies]
sidged-gateway = { path = "../sidged-gateway" }
serde_json = "1"
ratatui = "0.29"
sidged-cli = { path = "../sidged-cli" }
sidged-core = { path = "../sidged-core" }
sidged-grant = { path = "../sidged-grant" }
sidged-log = { path = "../sidged-log" }
sha2 = "0.10"
libc = "0.2"
getrandom = "0.2"
zeroize = "1"
