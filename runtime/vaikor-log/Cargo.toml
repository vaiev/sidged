[package]
name = "vaikor-log"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Append-only audit log for hosted runtime decisions."

[dependencies]
vaikor-core = { path = "../vaikor-core" }
# SHA-256 is the link from each audit line to the previous line (invariant 9).
sha2 = "0.10"
# Ed25519 signs each line. The seed is the operator's log key.
ed25519-dalek = "2"

serde_json = "1"

# flock(2): std::fs::File::try_lock is not implemented on every Unix target (Android).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
