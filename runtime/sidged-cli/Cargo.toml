[package]
name = "sidged-cli"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Hosted runtime library. A plan goes in. The core checks it and records the result."

[dependencies]
sidged-capability = { path = "../sidged-capability" }
sidged-core = { path = "../sidged-core" }
sidged-gateway = { path = "../sidged-gateway" }
sidged-grant = { path = "../sidged-grant" }
sidged-log = { path = "../sidged-log" }
sidged-mcp = { path = "../sidged-mcp" }
sidged-verify = { path = "../sidged-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"

libc = "0.2"
base64 = "0.22"
sidged-record = { path = "../sidged-record" }
# `sidged init`: a typed API key is held in Zeroizing until it is written to
# its own 0600 file. Already in the lock file via sidged-gateway (no new crate).
zeroize = "1"
# Time slots resolve in the node's IANA time zone (daylight saving time included).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }
# WebAuthn approvals (0004 R9w): ES256 assertions from platform authenticators; the
# enrolled key arrives as SubjectPublicKeyInfo (pkcs8). Ed25519 uses ed25519-dalek.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
ed25519-dalek = "2"

[features]
# The v0.1 swarm and signed-adapter prototypes (`swarm`, `adapter`) have their own
# authorization path outside the one engine; off by default until v0.5 rebuilds them on
# it (ROADMAP v0.5, 11g).
experimental = []

[[test]]
name = "swarm"
required-features = ["experimental"]
