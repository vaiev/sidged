[package]
name = "sidged-mcp"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Read Sidged capability descriptors from an MCP tools/list document."

[dependencies]
sidged-capability = { path = "../sidged-capability" }
# MCP tool lists are JSON. This crate parses that document and nothing else.
serde_json = "1"
