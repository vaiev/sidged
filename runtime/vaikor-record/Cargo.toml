[package]
name = "vaikor-record"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
unicode-normalization = "0.1"
vaikor-core = { path = "../vaikor-core" }
vaikor-grant = { path = "../vaikor-grant" }

# Only the file-backed store uses the audit chain; it is not built for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vaikor-log = { path = "../vaikor-log" }

[dev-dependencies]
vaikor-gateway = { path = "../vaikor-gateway" }
