#
# sysusers.d(5) for Vaikor (0004 R9c).
# - vaikor: the Core's own uid; owns /var/lib/vaikor and the approval directory.
# - vaikor-approver: the separate approver uid; its group is the approval
#   directory's group. The two never share a group. No agent, launcher, worker
#   or model uid may be added to either group or be able to switch to them.
#   The approver is a nologin system account; the operator explicitly arranges
#   a human-operated approval client under this uid.
u vaikor - "Vaikor Core" /var/lib/vaikor /usr/sbin/nologin
u vaikor-approver - "Vaikor approver (0004 R9)" - /usr/sbin/nologin
