# sysusers.d(5) for Sidged (0004 R9c).
# - sidged: the Core's own uid; owns /var/lib/sidged and the approval directory.
# - sidged-approver: the separate approver uid; its group is the approval
#   directory's group. The two never share a group. No agent, launcher, worker
#   or model uid may be added to either group or be able to switch to them.
#   The approver is a nologin system account; the operator explicitly arranges
#   a human-operated approval client under this uid.
u sidged - "Sidged Core" /var/lib/sidged /usr/sbin/nologin
u sidged-approver - "Sidged approver (0004 R9)" - /usr/sbin/nologin
