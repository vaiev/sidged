# tmpfiles.d(5) for Sidged. /run is a tmpfs, so the approval directory is
# re-created at every boot (0004 R9c): owner = core uid, group = approver
# group, setgid 2750. Ancestors are root-owned and not group/world-writable.
# The Core binds its socket inside it itself (umask 0117 -> 0660); it never
# creates or re-owns the directory.
d /run/sidged 0755 root root -
d /run/sidged/approval 2750 sidged sidged-approver -
