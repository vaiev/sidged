[package]
name = "vaikor-companion-app"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "Tauri v2 shell of the Vaikor companion node: vaikor-desktop and vaikor-android."

[lib]
name = "vaikor_companion_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
# 2.11.x is the last line that builds with the repository toolchain (rustc 1.89).
tauri = { version = "~2.11", features = [] }
serde_json = "1"
vaikor-companion-core = { path = "../vaikor-companion-core" }
# The GGUF header reader: the weights declare their output form (0017 L3b).
vaikor-cli = { path = "../../runtime/vaikor-cli" }
# The on-device model (WP 9b): weights are identified by SHA-256; getuid for the peer-uid check.
sha2 = "0.10"
libc = "0.2"
# Alarm instants are handed to the OS in UTC (see `alarms`).
time = { version = "0.3", features = ["parsing", "formatting"] }

# Timers and reminders ring through the OS on the phone (local notifications, no network).
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-notification = "~2.3"
