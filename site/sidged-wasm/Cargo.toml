[package]
name = "sidged-wasm"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "Pure Sidged verification (SDG-L3 plans, Cedar information flow, dCBOR records, artifact surfaces) for wasm32-unknown-unknown."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
sidged-grant = { path = "../../runtime/sidged-grant" }
sidged-record = { path = "../../runtime/sidged-record" }
sidged-verify = { path = "../../runtime/sidged-verify" }
