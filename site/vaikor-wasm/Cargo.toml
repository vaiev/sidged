[package]
name = "vaikor-wasm"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "Pure Vaikor verification (VKR-L3 plans, Cedar information flow, dCBOR records, artifact surfaces) for wasm32-unknown-unknown."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
vaikor-grant = { path = "../../runtime/vaikor-grant" }
vaikor-record = { path = "../../runtime/vaikor-record" }
vaikor-verify = { path = "../../runtime/vaikor-verify" }
